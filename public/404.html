<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>404 - Verix Core</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Inter&display=swap"
            rel="stylesheet"
        />
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                min-height: 100dvh;
                display: flex;
                align-items: center;
                justify-content: center;

                background-color: oklch(11.703% 0.00887 284.935);
                color: oklch(100% 0.00011 271.152);
                font-family: 'Inter', sans-serif;

                text-align: center;
            }

            .container {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 1.5rem;
                padding: 2.5rem;

                background: oklch(0% 0 0 / 0.2);
                backdrop-filter: blur(4px);
                border: 1px solid oklch(100% 0.00011 271.152 / 0.1);
                border-radius: 24px;
                box-shadow: 0 8px 32px 0 oklch(0% 0 0 / 0.37);

                max-width: 480px;
                width: calc(100% - 2rem);
            }

            .code {
                font-family: 'Space Grotesk', sans-serif;
                font-size: clamp(3rem, 2.2rem + 3vw, 4rem);
                font-weight: 700;
                line-height: 1.2;
                letter-spacing: -0.03em;

                background: linear-gradient(
                    90deg,
                    oklch(67.859% 0.27742 321.359) 0%,
                    oklch(62.31% 0.1881 259.83) 50%,
                    oklch(71.485% 0.12578 215.256) 100%
                );
                background-clip: text;
                -webkit-background-clip: text;
                color: transparent;
                -webkit-text-fill-color: transparent;
            }

            .title {
                font-family: 'Space Grotesk', sans-serif;
                font-size: clamp(1.25rem, 1.1rem + 0.6vw, 1.5rem);
                font-weight: 700;
                color: oklch(100% 0.00011 271.152);
            }

            .description {
                font-size: clamp(0.875rem, 0.8rem + 0.4vw, 1rem);
                line-height: 1.7;
                color: oklch(100% 0.00011 271.152 / 0.6);
            }

            .button {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                padding: 0.75rem 1.5rem;
                border-radius: 999px;
                border: none;
                cursor: pointer;
                text-decoration: none;

                font-family: 'Inter', sans-serif;
                font-size: clamp(0.875rem, 0.8rem + 0.4vw, 1rem);
                font-weight: 500;
                color: oklch(100% 0.00011 271.152);

                background: linear-gradient(
                    135deg,
                    oklch(67.859% 0.27742 321.359) 0%,
                    oklch(54.134% 0.24669 293.012) 35%,
                    oklch(62.31% 0.1881 259.83) 65%,
                    oklch(71.485% 0.12578 215.256) 100%
                );
                background-size: 200% 200%;
                background-position: 0% 50%;

                transition:
                    background-position 0.6s ease,
                    box-shadow 0.3s ease;
            }

            .button:hover {
                background-position: 100% 50%;
                box-shadow: 0 0 1.5rem oklch(54.134% 0.24669 293.012 / 0.35);
            }
        </style>
    </head>
    <body>
        <div class="container">
            <span class="code">404</span>
            <h1 class="title">Page not found</h1>
            <p class="description">
                Looks like this block doesn't exist on the chain.<br />
                Head back to the main network.
            </p>
            <a href="/verix_core/" class="button">Back to Home</a>
        </div>
    </body>
</html>
